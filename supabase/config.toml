# Minimal Supabase CLI configuration. The CLI fills in defaults for everything else.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "thecodecorner"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
